<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bill Calculator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="row mt-3">
        <div class="col colH"><h5>Admin</h5></div>
        <div class="col colH mx-1"><h5>Checkout</h5></div>
        <div class="col colH"><h5>Receipt</h5></div>
      </div>
      <div class="row">
        <div class="col colC">
          <div class="admin">
            <p class="mt-4">Add a new product</p>
            <input type="text" id="product" placeholder="Product Name" />
            <button
              type="button"
              class="btn btn-outline-dark"
              onclick="addProduct()"
            >
              Add product
            </button>
            <br /><br />
            <p>Select the product and add the price per unit</p>
            <select id="addP" onchange="productSelected()">
              <option
                class="select"
                disabled
                selected
                style="color: rgba(128, 128, 128, 0.673)"
              >
                items
              </option>
            </select>
            <br />

            <input type="number" id="price" placeholder="Price" />
            <button
              type="button"
              class="btn btn-outline-dark"
              onclick="addPrice()"
            >
              Add Price
            </button>

            <br /><br />
            <small id="success"></small>
          </div>
        </div>
        <div class="col colC mx-1">
          <br />
          <button
            type="button"
            class="btn btn-outline-dark new"
            onclick="addData()"
          >
            New Transaction
          </button>
          <p>Select a product then add the number of units.</p>
          <select id="checkoutProducts" onchange="productChosen()">
            <option
              class="select"
              disabled
              selected
              style="color: rgba(128, 128, 128, 0.673)"
            >
              Select Product
            </option>
          </select>
          <label for="">Unit: </label>
          <input type="number" min="1" max="9" id="unit" />
          <button
            type="button"
            class="btn btn-outline-dark new"
            onclick="addToCart()"
          >
            Add to cart
          </button>
          <br />
          <small id="cartMsg"></small>
          <br />
          <button
            type="button"
            class="btn btn-outline-dark unitBtn"
            onclick="setUnit(1)"
          >
            1
          </button>
          <button
            type="button"
            class="btn btn-outline-dark unitBtn"
            onclick="setUnit(2)"
          >
            2
          </button>
          <button
            type="button"
            class="btn btn-outline-dark unitBtn"
            onclick="setUnit(3)"
          >
            3
          </button>
          <button
            type="button"
            class="btn btn-outline-dark unitBtn"
            onclick="setUnit(4)"
          >
            4
          </button>
          <button
            type="button"
            class="btn btn-outline-dark unitBtn"
            onclick="setUnit(5)"
          >
            5
          </button>
          <button
            type="button"
            class="btn btn-outline-dark unitBtn"
            onclick="setUnit(6)"
          >
            6
          </button>
          <button
            type="button"
            class="btn btn-outline-dark unitBtn"
            onclick="setUnit(7)"
          >
            7
          </button>
          <button
            type="button"
            class="btn btn-outline-dark unitBtn"
            onclick="setUnit(8)"
          >
            8
          </button>
          <button
            type="button"
            class="btn btn-outline-dark unitBtn nine"
            onclick="setUnit(9)"
          >
            9
          </button>
          <br /><br /><br />
          <button
            type="button"
            class="btn btn-outline-dark new"
            onclick="generateBill()"
          >
            Pay
          </button>
          <br /><br /><br />
        </div>
        <div class="col colC">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Product</th>
                <th>₹/unit</th>
                <th>Unit(s)</th>
                <th>Price</th>
              </tr>
            </thead>

            <tbody id="receiptBody"></tbody>
          </table>

          <br />

          <p id="totalPrice"></p>

          <p id="tax"></p>

          <p id="amountDue"></p>
        </div>
      </div>
    </div>

    <script src="interact.js"></script>
  </body>
</html>
